name: build-apk-from-zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать самый новый zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIP" ]; then echo "В корне репозитория нет .zip"; exit 1; fi
          echo "Беру $ZIP"
          mkdir -p /tmp/src
          unzip -q -o "$ZIP" -d /tmp/src
          FOUND=$(find /tmp/src -name settings.gradle.kts | head -1)
          if [ -z "$FOUND" ]; then echo "В zip нет settings.gradle.kts"; exit 1; fi
          echo "ROOT=$(dirname "$FOUND")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Собрать APK
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lumi-notify-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
